# ============================================================
# Nginx 反代示例：前端静态由 FastAPI(8000) 托管，Nginx 监听对外端口
# 适用于生产部署：域名 / HTTPS 由 Nginx 负责，后端仅内网监听
# ============================================================
server {
    listen 80;
    server_name your-domain.com;   # 替换为你的域名或 IP

    # 访问日志
    access_log /var/log/nginx/prompt_opt.access.log;
    error_log  /var/log/nginx/prompt_opt.error.log;

    # 传输大小（报告导出 / 用例导入）
    client_max_body_size 20m;

    # 后端 API 与静态页面均代理到 FastAPI（单端口模式）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大模型接口耗时较长，放宽代理超时
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA history 路由回退：交给后端处理（后端已实现 fallback）
    # location / { try_files $uri $uri/ /index.html; }  # 若改为纯静态托管可启用此行
}